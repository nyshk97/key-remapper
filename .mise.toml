[tasks.gen]
description = "署名用xcconfigを生成してXcodeGenで.xcodeprojを生成する"
run = "bash scripts/gen-signing-xcconfig.sh && xcodegen generate"

[tasks.build]
description = "Debug (dev) ビルドする"
run = "mise run gen && xcodebuild -project keyrc.xcodeproj -scheme keyrc -configuration Debug -derivedDataPath build build"

[tasks.build-release]
description = "Release ビルドする（Developer ID 署名 + Hardened Runtime）"
run = "mise run gen && xcodebuild -project keyrc.xcodeproj -scheme keyrc -configuration Release -derivedDataPath build build"

[tasks.run]
description = "dev ビルドして起動する（既存の dev プロセスは終了してから）"
run = """
set -e
mise run build
pkill -x 'keyrc Dev' 2>/dev/null || true
sleep 1
open -g 'build/Build/Products/Debug/keyrc Dev.app'
"""

[tasks.install]
description = "Release ビルドを /Applications に配置して起動し直す"
run = """
set -e
mise run build-release
pkill -x keyrc 2>/dev/null || true
sleep 1
ditto 'build/Build/Products/Release/keyrc.app' /Applications/keyrc.app
open -g /Applications/keyrc.app
"""

[tasks.log]
description = "dev ビルドのログを follow する"
run = "tail -f /tmp/keyrc-dev.log"

[tasks.log-prod]
description = "本番アプリのログを follow する"
run = "tail -f /tmp/keyrc.log"

# --- リリース -------------------------------------------------------------
# 通常は release 1本で通す。個別タスクは途中で失敗したときの再開用に残してある。
# notarize は keychain の資格情報を読むため、自分の Terminal で実行する
# （Claude Code の Bash からは keychain に届かない環境がある）。

[tasks.release]
description = "リリースする（preflight → zip → notarize → GitHub Release 公開）。自分の Terminal で実行する"
run = """
set -e
bash scripts/preflight.sh
bash scripts/make-release-zip.sh
bash scripts/notarize.sh
bash scripts/publish-release.sh
"""

[tasks."release:preflight"]
description = "リリース前チェックだけ実行する（main・clean worktree・push 済み・タグと Release の未作成）"
run = "bash scripts/preflight.sh"

[tasks.release-zip]
description = "配布適格に再署名して dist/keyrc-<version>.zip を作る（notarize 前段）"
run = "bash scripts/make-release-zip.sh"

[tasks."release:notarize"]
description = "dist の zip を notarize + staple して差し替える。自分の Terminal で実行する"
run = "bash scripts/notarize.sh"

[tasks.publish-release]
description = "notarize済みzipをGitHub Releaseとして公開する（appcast.xml生成込み）。自分の Terminal で実行する"
run = "bash scripts/publish-release.sh"
