[tasks.gen]
description = "XcodeGen で .xcodeproj を生成する"
run = "xcodegen generate"

[tasks.build]
description = "Debug (dev) ビルドする"
run = "xcodegen generate && xcodebuild -project keyrc.xcodeproj -scheme keyrc -configuration Debug -derivedDataPath build build"

[tasks.build-release]
description = "Release ビルドする（Developer ID 署名 + Hardened Runtime）"
run = "xcodegen generate && xcodebuild -project keyrc.xcodeproj -scheme keyrc -configuration Release -derivedDataPath build build"

[tasks.run]
description = "dev ビルドして起動する（既存の dev プロセスは終了してから）"
run = """
set -e
mise run build
pkill -x 'keyrc Dev' 2>/dev/null || true
sleep 1
open -g 'build/Build/Products/Debug/keyrc Dev.app'
"""

[tasks.install]
description = "Release ビルドを /Applications に配置して起動し直す"
run = """
set -e
mise run build-release
pkill -x keyrc 2>/dev/null || true
sleep 1
ditto 'build/Build/Products/Release/keyrc.app' /Applications/keyrc.app
open -g /Applications/keyrc.app
"""

[tasks.log]
description = "dev ビルドのログを follow する"
run = "tail -f /tmp/keyrc-dev.log"

[tasks.log-prod]
description = "本番アプリのログを follow する"
run = "tail -f /tmp/keyrc.log"

[tasks.release-zip]
description = "配布適格に再署名して dist/keyrc-<version>.zip を作る（notarize 前段）"
run = "bash scripts/make-release-zip.sh"
