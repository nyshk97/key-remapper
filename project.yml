name: keyrc
options:
  deploymentTarget:
    macOS: "13.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
targets:
  keyrc:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: Sparkle
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: U4WAHGGBR7
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # dev と本番は Bundle ID を分離する（TCC 権限が独立し、併存しても衝突しない）
        # 署名を安定させないとリビルドのたびにアクセシビリティ権限が飛ぶため、
        # CODE_SIGN_IDENTITY は名前でなく証明書ハッシュで固定する
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.nyshk97.keyrc.dev
          PRODUCT_NAME: keyrc Dev
          # Apple Development: nyshk97@gmail.com
          CODE_SIGN_IDENTITY: 7B158CF1876B7D0C89A173E85E33A2DC61196CB7
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.nyshk97.keyrc
          PRODUCT_NAME: keyrc
          # Developer ID Application: Tsubasa Namatame
          CODE_SIGN_IDENTITY: 85D91870B2836DB303E2224A2D8D56051F26A6FB
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp
          # 素の xcodebuild build が get-task-allow を注入して notarize が Invalid になるのを防ぐ
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        # Sparkle は CFBundleVersion で新旧比較する。MARKETING_VERSION に連動させ bump 忘れを防ぐ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        # Sparkle（アップデータの起動自体は #if !DEBUG でガードしているため dev では無効）
        SUFeedURL: https://github.com/nyshk97/keyrc/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        # ログイン keychain の "Private key for signing Sparkle updates"（デフォルトアカウント ed25519）と対
        SUPublicEDKey: VnvTM72yjjc1FY/nzLI5uT/3mSxkOdG7k4dJqAPgZo8=
schemes:
  keyrc:
    build:
      targets:
        keyrc: all
    run:
      config: Debug
